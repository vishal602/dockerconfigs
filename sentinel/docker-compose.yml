services:
  coolify-sentinel:
    image: ghcr.io/coollabsio/coolify-sentinel:latest
    container_name: coolify-sentinel
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      # --- Core Configuration ---
      - SENTINEL_URL=http://127.0.0.1:8000/api/v1/sentinel/push
      - SENTINEL_TIMEOUT=60
      - SENTINEL_DEBUG=false
      - PUSH_INTERVAL=60
      
      # --- Your New Settings for History & Collection Rate ---
      - COLLECTOR_REFRESH_RATE_SECONDS=60
      - COLLECTOR_RETENTION_PERIOD_DAYS=10
      
      # --- Optional Settings ---
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"