services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    ports:
      - "8082:8080"  # Using 8082 instead of 8080 to avoid Coolify proxy conflict
    environment:
      - TZ=Australia/Melbourne
      - PORT=8080  # Keep this as 8080 (internal container port)
      # Add any other Termix-specific environment variables here
      # - JWT_SECRET=${JWT_SECRET}
      # - ENABLE_2FA=${ENABLE_2FA:-true}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - termix-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - termix-net

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    ports:
      - "4822:4822"  # 4822 is typically free, but if needed you could change to 4823
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "netstat", "-tln", "|", "grep", "4822"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - termix-net

volumes:
  termix-data:
    driver: local

networks:
  termix-net:
    driver: bridge