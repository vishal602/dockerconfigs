services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Australia/Melbourne
      - PORT=8080
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - termix-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    ports:
      - "4822:4822"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "netstat", "-tln", "|", "grep", "4822"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  termix-data:
    driver: local