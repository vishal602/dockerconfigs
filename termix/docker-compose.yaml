services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Australia/Melbourne
      - PORT=8080
      # Add any other Termix-specific environment variables here
      # - DATABASE_URL=sqlite:/app/data/termix.db
      # - JWT_SECRET=${JWT_SECRET}
      # - ENABLE_2FA=${ENABLE_2FA:-true}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/production/termix/data:/app/data
    depends_on:
      guacd:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://localhost:8080/ 2>&1 || true; [ $$? -eq 0 -o $$? -eq 4 ] || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - termix-net

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    ports:
      - "4822:4822"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "netstat", "-tln", "|", "grep", "4822"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - termix-net

networks:
  termix-net:
    driver: bridge